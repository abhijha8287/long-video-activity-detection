# Zone config for data/samples/running_02.mp4 (Wikimedia: 2019 Montevideo Sprint
# Triathlon American Cup, elite women's race, clip 17 — fenced transition area,
# a single runner clearly tracked, much less crowd occlusion than running_01.mp4).
#
# Authored by eyeballing the first frame at the video's native 1280x720
# resolution. Demo zone for the bundled sample gallery, not part of the scored
# evaluation (see data/samples/PROVENANCE.md).
video: running_02.mp4
frame_size: [1280, 720]
zones:
  - name: transition_area
    type: no_running
    polygon:
      - [0, 0]
      - [1280, 0]
      - [1280, 720]
      - [0, 720]
